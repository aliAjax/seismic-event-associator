services:
  seismic:
    build: {context: .., dockerfile: deploy/Dockerfile}
    ports: ["18336:18336"]
    environment: {SEISMIC_ADDRESS: ":18336", SEISMIC_API_KEY: "seismic-dev"}
    depends_on: {postgres: {condition: service_healthy}}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: seismic, POSTGRES_PASSWORD: seismic, POSTGRES_DB: seismic}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U seismic"], interval: 3s, timeout: 2s, retries: 10}
    volumes: ["seismic_pg:/var/lib/postgresql/data"]
volumes: {seismic_pg: {}}

